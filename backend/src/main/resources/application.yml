spring:
  application:
    name: jobtracker
  # Local development: values are read from the git-ignored .env file in the project root.
  # In production (Render, Docker) the same names come from real environment variables.
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:./.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobtracker}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      # Small pool: Neon's free tier and Render's free instance are both tiny.
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  autoconfigure:
    # We authenticate with our own JWT filter, so Spring's generated default user is not needed.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-hours: 24
  seed:
    enabled: ${SEED_DEMO_DATA:true}
  reminders:
    enabled: true
    # Every day at 08:00 server time.
    cron: ${REMINDERS_CRON:0 0 8 * * *}
    zone: ${REMINDERS_ZONE:UTC}
  mail:
    # Emails are only sent when MAIL_HOST is set (e.g. smtp.gmail.com); otherwise they are just logged.
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:no-reply@jobtracker.local}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
      fallback-model: ${GEMINI_FALLBACK_MODEL:gemini-3.5-flash-lite}
      base-url: https://generativelanguage.googleapis.com
      timeout-seconds: 30
    rate-limit:
      per-minute: 5
      per-day: 40
